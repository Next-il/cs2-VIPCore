name: release

# Next-il: our own build. Every push to main builds the core, the API and the modules our servers run into one
# zip, VIPCore-v<N>.zip, released as v<N>. The Mounts "VIP" group installs every folder of it at once, so the
# core, the shared API and the modules can never be on different versions.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

env:
  # The modules we ship. Upstream's other modules stay in the tree but are not built.
  MODULES: VIP_Fov VIP_Flags VIP_ExperienceMultiplier VIP_Tags

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out the next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          # Highest v<N> across releases and tags (upstream's v2.0.x tags don't match), at least v3
          releases=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' || true)
          tags=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||')
          highest=$(printf '%s\n%s\n' "$releases" "$tags" | { grep -E '^v[0-9]+$' || true; } | sed 's/^v//' | sort -n | tail -1)
          next=$(( ${highest:-0} + 1 ))
          [ "$next" -lt 3 ] && next=3
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "number=${next}" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: VIPCore
        run: |
          set -e
          props="-c Release --nologo -p:Version=${{ steps.version.outputs.number }}.0.0"
          dotnet publish VipCoreApi/VipCoreApi.csproj $props -o ../build/VipCoreApi
          dotnet publish VIPCore/VIPCore.csproj $props -o ../build/VIPCore
          for m in $MODULES; do dotnet publish "modules/$m/$m.csproj" $props -o "../build/$m"; done

      # One folder per mount, each laid out as it sits on the server. An allowlist on purpose: CounterStrikeSharp's
      # own dlls must never ship next to a plugin, and VipCoreApi.dll lives only in shared/ - a copy in a plugin
      # folder gives that plugin its own IVipCoreApi type and the capability lookup fails.
      - name: Stage release layout
        run: |
          set -e
          mkdir -p out/VIPCore out/VipCoreApi
          # PanoramaManager: the VIP HUD library loads from the plugin's own folder
          cp build/VIPCore/{VIPCore.dll,VIPCore.deps.json,VIPCore.pdb,Dapper.dll,MySqlConnector.dll,PanoramaManager.dll} out/VIPCore/
          cp -r VIPCore/VIPCore/lang out/VIPCore/lang
          cp build/VipCoreApi/{VipCoreApi.dll,VipCoreApi.deps.json,VipCoreApi.pdb} out/VipCoreApi/
          for m in $MODULES; do
            mkdir -p "out/$m"
            cp "build/$m/$m.dll" "build/$m/$m.deps.json" "build/$m/$m.pdb" "out/$m/"
          done

      - name: Verify the layout
        run: |
          set -e
          test -f out/VIPCore/VIPCore.dll
          test -f out/VIPCore/lang/en.json
          test -f out/VIPCore/PanoramaManager.dll
          test -f out/VipCoreApi/VipCoreApi.dll
          for m in $MODULES; do test -f "out/$m/$m.dll"; done
          if find out -name 'CounterStrikeSharp.API.dll' | grep -q . || find out -name 'VipCoreApi.dll' -not -path 'out/VipCoreApi/*' | grep -q .; then
            echo "::error::A host or shared dll ended up in a plugin folder"
            exit 1
          fi
          find out -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: VIPCore
          path: out/

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          tag="${{ steps.version.outputs.tag }}"
          (cd out && zip -qr "../VIPCore-$tag.zip" . -x '*.DS_Store')
          gh release create "$tag" "VIPCore-$tag.zip" --target "${{ github.sha }}" --title "$tag" --generate-notes
